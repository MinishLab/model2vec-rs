[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "model2vec-rs"
description = "Python bindings for model2vec-rs, the Rust implementation of Model2Vec"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy", "tokenizers"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.maturin]
module-name = "model2vec_rs"
features = ["pyo3/extension-module"]
