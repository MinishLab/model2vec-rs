[package]
name = "model2vec-rs-python"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Python bindings for model2vec-rs"
license = "MIT"
publish = false

[lib]
name = "model2vec_rs_py"
crate-type = ["cdylib"]

[dependencies]
model2vec-rs = { path = ".." }
pyo3 = { version = "0.29", features = ["abi3-py39", "anyhow"] }
numpy = "0.29"
ndarray = "0.15"
tokenizers = { version = "0.21", default-features = false }
