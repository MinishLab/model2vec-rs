name: Release Python

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. py-v0.4.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Check tag matches python/Cargo.toml version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            py-v*) ;;
            *) echo "Tag must start with py-v, got $TAG"; exit 1 ;;
          esac
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' python/Cargo.toml | head -1)
          if [ "py-v$VERSION" != "$TAG" ]; then
            echo "Tag $TAG does not match python/Cargo.toml version $VERSION"
            exit 1
          fi

  wheels:
    name: Wheel (${{ matrix.platform.name }})
    needs: verify
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28" }
          - { name: musllinux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { name: musllinux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { name: macos-x86_64, runner: macos-latest, target: x86_64-apple-darwin }
          - { name: macos-aarch64, runner: macos-latest, target: aarch64-apple-darwin }
          - { name: windows-x86_64, runner: windows-latest, target: x64 }
          - { name: windows-aarch64, runner: windows-11-arm, target: aarch64-pc-windows-msvc }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          args: --release --out dist

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform.name }}
          path: python/dist

  sdist:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist

  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
